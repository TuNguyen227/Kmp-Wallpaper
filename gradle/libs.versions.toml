[versions]
agp = "8.8.2"
android-compileSdk = "35"
android-minSdk = "25"
android-targetSdk = "35"
androidx-activityCompose = "1.9.3"
coilCompose = "3.1.0"
compose-multiplatform = "1.7.3"
firebaseBom = "33.11.0"
firebaseCommon = "1.8.1"
firebaseCommonKtx = "21.0.0"
firebaseDatabase = "2.1.0"
kotlin = "2.1.10"
decompose-coroutines = "2.5.0"
google-service = "4.4.2"
pagingComposeCommon = "3.3.0-alpha02-0.5.1"
platform-kore = "0.1.0"
mvi = "4.3.0"
decompose-router = "0.9.0"
datastore = "1.1.6"

[libraries]
coil-network-ktor3 = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coilCompose" }
decompose-router = { module = "io.github.xxfast:decompose-router", version.ref = "decompose-router"}
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coilCompose" }
decompose-coroutines = { module = "com.arkivanov.essenty:lifecycle-coroutines", version.ref = "decompose-coroutines"}
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-common = { module = "dev.gitlive:firebase-common", version.ref = "firebaseCommon" }
firebase-common-ktx = { module = "com.google.firebase:firebase-common-ktx", version.ref = "firebaseCommonKtx" }
firebase-database = { module = "dev.gitlive:firebase-database", version.ref = "firebaseDatabase" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activityCompose" }
paging-common = { module = "app.cash.paging:paging-common", version.ref = "pagingComposeCommon" }
